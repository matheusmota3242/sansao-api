server:
  servlet:
    session:
      # Só cookie: o ;jsessionid= na URL vaza a sessão em log, histórico e Referer.
      tracking-modes: cookie

spring:
  application:
    name: Simao

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  # Semeia o primeiro admin quando o banco não tem usuário nenhum.
  first-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrador}
  # Onde ficam os bytes das imagens. Em container, aponte para um volume —
  # senão as fotos somem a cada deploy.
  media-path: ${MEDIA_PATH:media}
  # Origens da loja estática que podem ler o catálogo público. Vazio = sem CORS,
  # que é o certo enquanto a loja for servida pelo próprio app.
  storefront-origins: ${STOREFRONT_ORIGINS:}
