# Stack de produção para o Coolify.
# O Coolify builda a app a partir de deploy/Dockerfile e orquestra tudo.
# NÃO há arquivos .env aqui: defina as variáveis na aba "Environment Variables"
# do recurso no Coolify — ele as injeta nos ${...} abaixo no deploy.

services:
  postgres-app:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-app:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: jdbc:postgresql://postgres-app:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    # A API e o admin ARGILA LAB (UI em /argilalabapp.html) sobem aqui.
    # O proxy do Coolify não é usado neste servidor (sem coolify-proxy e a
    # máquina está atrás de NAT), então publicamos a porta direto na interface
    # da Tailscale: defina APP_BIND_IP nas Environment Variables do Coolify
    # como o IP 100.x do servidor na tailnet. Sem essa variável, fica só em
    # 127.0.0.1 (acessível apenas na própria máquina).
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:8080:8080"
    expose:
      - "8080"

volumes:
  postgres-data:
