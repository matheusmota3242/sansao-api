# Stack de produção para o notebook Ubuntu.
# Diferença vs. dev: a app NÃO é buildada aqui — é puxada pronta do GHCR, e o
# Watchtower atualiza o container sozinho quando o CI publica uma imagem nova.
# 1 Postgres (2 bancos), WAHA NOWEB. Portas só em 127.0.0.1 (acesso via Tailscale).

services:
  postgres-app:
    image: postgres:alpine
    container_name: simao-postgres
    restart: unless-stopped
    env_file: [.postgres_app.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matheus -d simao_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  waha:
    image: devlikeapro/waha:latest-2026.7.1
    container_name: simao-waha
    restart: unless-stopped
    depends_on:
      postgres-app:
        condition: service_healthy
    env_file: [.waha_env]
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"   # painel do WAHA (exposto via `tailscale serve`)

  app:
    image: ghcr.io/matheusmota3242/simao-app:latest
    container_name: simao-app
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    env_file: [.app_env]
    depends_on:
      postgres-app:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:8080:8080"   # API (opcional expor via tailscale serve)

  # Vigia o GHCR e reinicia a app quando sai imagem nova. É o "deploy" do pipeline.
  watchtower:
    image: containrrr/watchtower
    container_name: simao-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Se o pacote no GHCR for PRIVADO, descomente para dar o login ao watchtower:
      # - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --label-enable --cleanup

volumes:
  postgres-data:
  waha_sessions:
