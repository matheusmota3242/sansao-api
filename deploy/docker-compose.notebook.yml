# Stack de produção do ARGILA LAB (loja + admin).
# A app NÃO é buildada aqui — é puxada pronta do GHCR, e o Watchtower atualiza
# o container sozinho quando o CI publica uma imagem nova.
# Portas só em 127.0.0.1: exponha via Tailscale ou por um proxy com TLS.

services:
  postgres-app:
    image: postgres:17-alpine
    container_name: simao-postgres
    restart: unless-stopped
    env_file: [.postgres_app.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matheus -d simao_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/matheusmota3242/simao-app:latest
    container_name: simao-app
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    env_file: [.app_env]
    depends_on:
      postgres-app:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # API + admin ARGILA LAB (UI em /argilalabapp.html, servida pelo jar).
      - "127.0.0.1:8080:8080"

  # Vigia o GHCR e reinicia a app quando sai imagem nova. É o "deploy" do pipeline.
  watchtower:
    image: containrrr/watchtower
    container_name: simao-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Se o pacote no GHCR for PRIVADO, descomente para dar o login ao watchtower:
      # - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --label-enable --cleanup

volumes:
  postgres-data:
