# Stack de produção do ARGILA LAB (loja + admin).
# Serve qualquer servidor: notebook, VM Oracle, o que for. A app NÃO é buildada
# aqui — o CI builda no GitHub e publica no GHCR, e o Watchtower atualiza o
# container sozinho quando sai imagem nova. Buildar Java na própria máquina
# seria lento numa VM pequena, por isso ela só puxa a imagem pronta.
# Portas só em 127.0.0.1: exponha via Tailscale ou por um proxy com TLS.

services:
  postgres-app:
    image: postgres:17-alpine
    container_name: simao-postgres
    restart: unless-stopped
    env_file: [.postgres_app.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matheus -d simao_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/matheusmota3242/simao-app:latest
    container_name: simao-app
    restart: unless-stopped
    # Um bloco só: dois `environment:` no mesmo serviço são chave duplicada, e o
    # compose recusa o arquivo inteiro em vez de mesclar.
    environment:
      TZ: America/Sao_Paulo
      MEDIA_PATH: /app/media
      # O app fica atrás de um proxy com TLS, então precisa levar a sério o
      # X-Forwarded-Proto para saber que a requisição chegou por HTTPS — é disso
      # que os dois cookies tiram a flag Secure. `native` e não `framework`: só
      # ele pega o JSESSIONID também (ver o comentário no application.yaml).
      FORWARD_HEADERS: native
    # .app_env leva DATABASE_*, ADMIN_EMAIL/ADMIN_PASSWORD (primeiro admin) e,
    # quando a loja estática estiver noutro domínio, STOREFRONT_ORIGINS.
    env_file: [.app_env]
    depends_on:
      postgres-app:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      # Os bytes das imagens vivem aqui. Sem este volume, toda atualização de
      # container levaria as fotos do catálogo junto.
      - media-data:/app/media
    ports:
      # API + admin ARGILA LAB (UI em /argilalabapp.html, servida pelo jar).
      - "127.0.0.1:8080:8080"

  # Vigia o GHCR e reinicia a app quando sai imagem nova. É o "deploy" do pipeline.
  watchtower:
    image: containrrr/watchtower
    container_name: simao-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Se o pacote no GHCR for PRIVADO, descomente para dar o login ao watchtower:
      # - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --label-enable --cleanup

volumes:
  postgres-data:
  media-data:
